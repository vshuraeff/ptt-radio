# publishes the GitHub Release of a v<version> tag: the mod zip, the companion for linux, windows and macos,
# the static hub, and SHA256SUMS. see RELEASING.md.
name: release

on:
  push:
    tags: ['v*']

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: check the tag against info.json and Cargo.toml
        id: version
        run: |
          tools/check-version.sh "$GITHUB_REF_NAME"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  mod:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tools/package-mod.sh "$VERSION" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mod
          path: dist/ptt-radio_${{ env.VERSION }}.zip
          if-no-files-found: error

  # built inside ubuntu 22.04 so the binary needs only glibc 2.35 and runs on ubuntu 22.04 and debian 12.
  # a container rather than cargo-zigbuild: the bundled libopus builds with the distro's own cmake and gcc.
  # x11rb (global-hotkey) is pure rust, so alsa is the only system library.
  # 22.04 is a deliberate exception to the latest-images rule, kept for the glibc 2.35 floor that the glibc reach step enforces.
  companion-linux:
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    permissions:
      contents: read
    steps:
      - name: install system packages
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl build-essential cmake pkg-config libasound2-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: companion -> target
          cache-bin: false
          shared-key: companion-linux
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      - name: build
        working-directory: companion
        env:
          PTT_RADIO_RELEASE_BUILD: '1'
        run: cargo build --locked --release --bin ptt-radio-companion
      - name: glibc reach
        run: |
          max=$(objdump -T companion/target/release/ptt-radio-companion | grep -o 'GLIBC_[0-9.]*' | sed 's/^GLIBC_//' | sort -uV | tail -n 1)
          echo "highest glibc symbol version: $max"
          if [ "$(printf '%s\n' "$max" 2.35 | sort -V | tail -n 1)" != 2.35 ]; then
            echo "::error::the linux companion needs glibc $max, above 2.35"
            exit 1
          fi
      - name: package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION=${RELEASE_TAG#v}
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p stage dist
          cp companion/target/release/ptt-radio-companion LICENSE stage/
          tools/archive-readme.sh "$VERSION" README.md stage/README.md
          tar -czf "dist/ptt-radio-companion-$VERSION-linux-x86_64.tar.gz" -C stage ptt-radio-companion LICENSE README.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: companion-linux-x86_64
          path: dist/ptt-radio-companion-${{ env.VERSION }}-linux-x86_64.tar.gz
          if-no-files-found: error

  companion-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      # the windows image converts line endings on checkout, which breaks the bash scripts in tools/
      - name: keep lf line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install rust
        run: rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: companion -> target
          cache-bin: false
          shared-key: companion-windows
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      - name: build
        working-directory: companion
        env:
          PTT_RADIO_RELEASE_BUILD: '1'
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --bin ptt-radio-companion
      - name: package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION=${RELEASE_TAG#v}
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p stage dist
          cp companion/target/x86_64-pc-windows-msvc/release/ptt-radio-companion.exe LICENSE stage/
          tools/archive-readme.sh "$VERSION" README.md stage/README.md
          cd stage && 7z a -tzip "../dist/ptt-radio-companion-$VERSION-windows-x86_64.zip" ptt-radio-companion.exe LICENSE README.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: companion-windows-x86_64
          path: dist/ptt-radio-companion-${{ env.VERSION }}-windows-x86_64.zip
          if-no-files-found: error

  # the signing secrets reach only the steps that use them, never the cargo build and its build scripts.
  # without MACOS_CERTIFICATE_P12 the binary ships unsigned and every signing step is skipped with a notice.
  companion-macos:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install rust
        run: rustup toolchain install stable --profile minimal --target aarch64-apple-darwin,x86_64-apple-darwin && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: companion -> target
          cache-bin: false
          shared-key: companion-macos
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      - name: build both architectures
        working-directory: companion
        env:
          PTT_RADIO_RELEASE_BUILD: '1'
        run: cargo build --locked --release --target aarch64-apple-darwin --target x86_64-apple-darwin --bin ptt-radio-companion
      - name: universal binary
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION=${RELEASE_TAG#v}
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p stage dist
          lipo -create -output stage/ptt-radio-companion \
            companion/target/aarch64-apple-darwin/release/ptt-radio-companion \
            companion/target/x86_64-apple-darwin/release/ptt-radio-companion
          lipo -info stage/ptt-radio-companion
          cp LICENSE stage/
          tools/archive-readme.sh "$VERSION" README.md stage/README.md
      - name: check for the signing secrets
        id: signing
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
        run: |
          if [ -n "$MACOS_CERTIFICATE_P12" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::MACOS_CERTIFICATE_P12 is not set: the macOS companion ships unsigned and not notarized"
          fi
      - name: import the certificate into a temporary keychain
        if: steps.signing.outputs.enabled == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          keychain_password=$(openssl rand -hex 24)
          echo "::add-mask::$keychain_password"
          cert="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$cert"
          security create-keychain -p "$keychain_password" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN"
          security import "$cert" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$cert"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$KEYCHAIN" > /dev/null
          # codesign finds the identity through the user search list
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
      - name: codesign
        if: steps.signing.outputs.enabled == 'true'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          codesign --force --sign "$MACOS_SIGNING_IDENTITY" --keychain "$KEYCHAIN" \
            --options runtime --timestamp --entitlements companion/macos/entitlements.plist \
            stage/ptt-radio-companion
          codesign --verify --strict --verbose=2 stage/ptt-radio-companion
          codesign --display --entitlements - stage/ptt-radio-companion
      - name: zip
        run: ditto -c -k stage "dist/ptt-radio-companion-$VERSION-macos-universal.zip"
      # a bare binary cannot be stapled, so the zip is notarized and nothing is stapled
      - name: notarize
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_TEAM_ID" ] || [ -z "$APPLE_APP_PASSWORD" ]; then
            echo "::error::the certificate is set but APPLE_ID, APPLE_TEAM_ID or APPLE_APP_PASSWORD is missing"
            exit 1
          fi
          xcrun notarytool submit "dist/ptt-radio-companion-$VERSION-macos-universal.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" \
            --wait --output-format json > "$RUNNER_TEMP/notary.json"
          cat "$RUNNER_TEMP/notary.json"
          status=$(plutil -extract status raw "$RUNNER_TEMP/notary.json")
          if [ "$status" != Accepted ]; then
            id=$(plutil -extract id raw "$RUNNER_TEMP/notary.json")
            xcrun notarytool log "$id" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
            echo "::error::notarization status: $status"
            exit 1
          fi
      - name: delete the temporary keychain
        if: always() && steps.signing.outputs.enabled == 'true'
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then
            security delete-keychain "$KEYCHAIN" || true
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: companion-macos-universal
          path: dist/ptt-radio-companion-${{ env.VERSION }}-macos-universal.zip
          if-no-files-found: error

  # a called workflow can only keep or lower the caller's token permissions, so the image push in hub.yml
  # gets packages: write from this job
  hub:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/hub.yml
    with:
      version: ${{ github.ref_name }}

  release:
    needs: [version, mod, companion-linux, companion-windows, companion-macos, hub]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # only the release artifacts, each holding one archive; the run also has build-record artifacts
      # (*.dockerbuild from hub.yml's docker builds) that must not become assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mod
          path: assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: companion-*
          path: assets
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hub-linux-*
          path: assets
          merge-multiple: true
      # exactly the six archives of the release contract, then their checksums; the list is what gets published
      - name: check assets and write checksums
        working-directory: assets
        run: |
          expected=(
            "ptt-radio_$VERSION.zip"
            "ptt-radio-companion-$VERSION-linux-x86_64.tar.gz"
            "ptt-radio-companion-$VERSION-windows-x86_64.zip"
            "ptt-radio-companion-$VERSION-macos-universal.zip"
            "ptt-radio-hub-$VERSION-linux-x86_64.tar.gz"
            "ptt-radio-hub-$VERSION-linux-aarch64.tar.gz"
          )
          ls -l
          printf '%s\n' "${expected[@]}" | sort > "$RUNNER_TEMP/expected.txt"
          find . -mindepth 1 -printf '%P\n' | sort > "$RUNNER_TEMP/found.txt"
          if ! diff "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/found.txt"; then
            echo "::error::the downloaded assets differ from the six release archives (diff above: < missing, > unexpected)"
            exit 1
          fi
          sha256sum -- "${expected[@]}" > SHA256SUMS
          cat SHA256SUMS
          printf 'assets/%s\n' "${expected[@]}" SHA256SUMS > "$RUNNER_TEMP/assets.txt"
      # the section of changelog.txt between "Version: <ver>" and the next dashed separator
      - name: release notes
        run: |
          awk -v v="$VERSION" '
            /^-+$/ { if (found) exit; next }
            $1 == "Version:" && $2 == v { found = 1; next }
            found { print }
          ' mod/ptt-radio/changelog.txt > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::no changelog.txt section for version $VERSION"
            exit 1
          fi
          cat "$RUNNER_TEMP/notes.md"
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # published, not a draft or prerelease, and marked latest, so releases/latest (the self-updater) sees it
        run: |
          mapfile -t assets < "$RUNNER_TEMP/assets.txt"
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft=false --prerelease=false --latest \
            --title "ptt-radio $VERSION" --notes-file "$RUNNER_TEMP/notes.md" "${assets[@]}"
