[package]
name = "ptt-radio-companion"
version = "0.4.0"
edition = "2024"
description = "Desktop companion for the ptt-radio Factorio mod: push-to-talk capture, Opus, playback"
publish = false

[features]
default = ["audio", "self-update"]
audio = ["dep:cpal", "dep:global-hotkey", "dep:hound", "dep:is", "dep:opusic-c", "dep:sonora", "dep:snow", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:windows-sys"]
# the companion updates itself from the latest GitHub release at startup; the hub never needs it
self-update = ["dep:flate2", "dep:self-replace", "dep:semver", "dep:serde_json", "dep:tar", "dep:ureq", "dep:zip"]

[dependencies]
clap = { version = "4", features = ["derive"] }
cpal = { version = "0.18", optional = true }
ctrlc = { version = "3", features = ["termination"] }
# relay grant secrets and BIND challenges; the version snow already uses
getrandom = "=0.3.4"
global-hotkey = { version = "0.9", optional = true }
# BIND proofs (HMAC-SHA-256 keyed by the grant secret), same RustCrypto line as sha2
hmac = "=0.12.1"
hound = { version = "3.5", optional = true }
is = { version = "=0.11.1", optional = true }
# default feature "bundled": builds the vendored libopus 1.6.1 with cmake and links it statically,
# so no system libopus is needed on any platform
opusic-c = { version = "1.6.1", optional = true }
sonora = { version = "=0.2.0", optional = true }
sha2 = "=0.10.9"
snow = { version = "=0.10.0", optional = true, default-features = false, features = ["std", "use-aes-gcm", "use-chacha20poly1305", "use-sha2", "use-curve25519", "use-getrandom"] }
# self-update (src/self_update.rs): GitHub releases over rustls, the release archives, the atomic swap
flate2 = { version = "1.1.10", optional = true }
self-replace = { version = "1.5.0", optional = true }
semver = { version = "1.0.28", optional = true }
serde_json = { version = "1.0.154", optional = true }
tar = { version = "0.4.46", default-features = false, optional = true }
ureq = { version = "3.5.0", default-features = false, features = ["rustls"], optional = true }
zip = { version = "9.1.0", default-features = false, features = ["deflate-flate2"], optional = true }

[[bin]]
name = "ptt-radio-companion"
path = "src/main.rs"
required-features = ["audio"]

[[bin]]
name = "relay"
path = "src/bin/relay.rs"
required-features = ["audio"]

[[bin]]
name = "ptt-radio-hub"
path = "src/bin/ptt-radio-hub.rs"

# offline comparison only; no neural runtime in the production companion
[dev-dependencies]
cpu-time = "1.0"
dtln-runtime-lab = { path = "experiments/dtln-runtime" }
rustfft = "6.4"

# the macOS event loop the global hotkey needs (see src/ptt_key.rs)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = ["std", "NSApplication", "NSEvent", "NSResponder", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "NSDate", "NSRunLoop", "NSString"] }

# the win32 message pump the global hotkey needs (see src/ptt_key.rs); the version global-hotkey uses
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", optional = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
