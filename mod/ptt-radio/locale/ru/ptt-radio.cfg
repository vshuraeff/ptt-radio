rx-admin=Обязательный канал администратора: вы слышите его, пока рация включена.

presets-title=Пресеты
presets-empty=Пресетов пока нет.
preset-up=Выше
preset-down=Ниже
preset-remove=Убрать
preset-add=Добавить текущий TX
preset-add-tooltip=Добавляет канал передачи в пресеты (не больше 8).
preset-full=Заняты все 8 пресетов.
preset-present=Текущий канал передачи уже в пресетах.
cycle=Следующий пресет
cycle-tooltip=Переключает TX на следующий разрешённый пресет. Горячая клавиша по умолчанию не назначена: назначьте «Переключать пресеты рации» в настройках управления.
cycled=Рация: передача на

known-title=Известные каналы
known-hint=Нажмите на канал, чтобы передавать на нём. Чтобы создать новый канал, выберите неиспользуемый сигнал в выборе TX выше.
known-empty=Пока никто не сидит на канале.
known-tune=Передавать на этом канале
known-admin=админ

honest-short=Каналы разделяют слушателей только среди честных клиентов.
honest-note=Каналы разделяют, кто кого слышит, только среди честных клиентов. Сервер и изменённый клиент могут слышать всё.

