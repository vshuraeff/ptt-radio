echo-tooltip=эхо от динамиков
echo-panel=Микрофон слышит динамики: наденьте наушники или выключите открытый микрофон
echo-open-mic-off=Выключить открытый микрофон

hud-more=ещё __1__
hud-echo=эхо
hud-link-unknown=Качество связи неизвестно
hud-link-unknown-details=Качество связи неизвестно: __1__, __2__
hud-link=Связь: __1__, __2__
hud-route-0=через игру
hud-route-1=напрямую
hud-route-2=через хаб
hud-route-3=через игрока-ретранслятор
hud-delay-0=задержка неизвестна
hud-delay-1=задержка меньше 100 мс
hud-delay-2=задержка 100–200 мс
hud-delay-3=задержка больше 200 мс

ptt-radio-admin-title=Администрирование
ptt-radio-admin-rules=Политика сохраняется в игре. Блокировки касаются выбора каналов и пресетов: игрок всегда может выключить рацию целиком. Админ-канал обязателен только при включённой рации. Каналы управляют воспроизведением у честных клиентов, но не скрывают голос от модифицированного клиента.
ptt-radio-admin-any-warning=ANY как админ-канал слышат все с включённой рацией в пределах настройки охвата рации (по умолчанию — все игроки). Обычные передатчики на ANY замолчат, если они не администраторы и не в списке вещателей.
ptt-radio-admin-signal-help=Выберите сигнал, ANY или HERE для действий с каналом ниже. HERE нельзя назначить обязательным админ-каналом.
ptt-radio-admin-signal=Сигнал
ptt-radio-admin-channel=Назначить админ-канал
ptt-radio-admin-clear-channel=Убрать админ-канал
ptt-radio-admin-ban=Запретить канал
ptt-radio-admin-unban=Снять запрет канала
ptt-radio-admin-pin=Закрепить канал
ptt-radio-admin-unpin=Открепить канал
ptt-radio-admin-target-help=Игрок: точное имя (здесь без кавычек) или числовой индекс. Для запрета используется выбранный сигнал. tx — передача, rx — приём, both/all — оба.
ptt-radio-admin-mute=Заглушить игрока
ptt-radio-admin-unmute=Снять заглушение
ptt-radio-admin-publisher-add=Разрешить вещание
ptt-radio-admin-publisher-remove=Отозвать вещание
ptt-radio-admin-deny=Запретить игроку канал
ptt-radio-admin-allow=Снять личный запрет
ptt-radio-admin-lock=Блокировать выбор
ptt-radio-admin-unlock=Разблокировать выбор
ptt-radio-admin-confine-help=Ограничение: разрешённые каналы через пробел, например ANY item/iron-plate HERE. Обязательный админ-канал по-прежнему слышен при включённой рации.
ptt-radio-admin-confine=Ограничить каналами
ptt-radio-admin-release=Снять ограничение
ptt-radio-admin-current-channel=Админ-канал: __1__
ptt-radio-admin-current-global=Запрещены: __1__; закреплены: __2__
ptt-radio-admin-current-player=__1__ (#__2__): заглушён=__3__, вещатель=__4__, блокировка=__5__, разрешены=__6__, запреты=__7__
ptt-radio-admin-command-help=Политика рации. /radio-admin покажет синтаксис. Каналы: ANY, HERE, тип/имя (без типа — item). Игроки: индекс или точное имя в двойных кавычках.
ptt-radio-admin-usage=Синтаксис: /radio-admin channel <канал>|none; publisher add|remove <игрок>; ban|unban|pin|unpin <канал>; deny <игрок> <канал> tx|rx|both; allow <игрок> <канал>; lock <игрок> tx|rx|all; unlock <игрок>; confine <игрок> <каналы...>; release <игрок>; mute|unmute <игрок>. Имена с пробелами заключайте в двойные кавычки; экранирования кавычек нет (используйте индекс).
ptt-radio-admin-applied=Политика рации обновлена.
ptt-radio-admin-unchanged=Это значение уже установлено.
ptt-radio-admin-not-admin=Менять политику рации может только администратор.
ptt-radio-admin-invalid-player=Игрок не найден. Укажите точное имя или положительный числовой индекс.
ptt-radio-admin-invalid-channel=Неверный канал. Укажите ANY, HERE или существующий сигнал тип/имя; параметры и специальные сигналы не являются каналами.
ptt-radio-admin-invalid-mode=Неверный режим. Запрет: tx, rx, both. Блокировка: tx, rx, all.
ptt-radio-admin-server=Игрок 0 — серверный источник, к нему не применяется эта политика.
ptt-radio-admin-mandatory=Админ-канал нельзя запретить. Сначала уберите его назначение или конфликтующий запрет.
ptt-radio-admin-here-mandatory=HERE зависит от поверхности и не может быть обязательным админ-каналом.
ptt-radio-admin-ban-pin=Канал нельзя одновременно запретить и закрепить. Сначала уберите конфликтующее правило.
ptt-radio-admin-confine-empty=Нужен хотя бы один разрешённый канал. Для снятия ограничения используйте release.
ptt-radio-admin-confine-banned=Разрешённый канал ограничения запрещён глобально. Сначала уберите конфликтующее правило.
ptt-radio-admin-confine-denied=Разрешённый канал ограничения запрещён в обоих направлениях. Сначала уберите конфликтующее правило.
ptt-radio-admin-lock-forbidden=Игрок окажется заблокирован на запрещённом TX-канале. Разблокируйте выбор или смените канал перед применением правила.

[ptt-radio-settings]
upgrade-required=Обновите компаньон для работы каналов рации. Этот компаньон не может передавать или принимать голос.
title=Настройки рации
close=Закрыть
refused=Не изменено:
refused-invalid-player=нет такого игрока.
refused-invalid-channel=это не годится в канал.
refused-unusable-signal=этот сигнал не может быть каналом (пустой, параметр, «каждый», «любой» или «все»).
refused-locked=администратор заблокировал эту настройку.
refused-banned=администратор запретил этот канал.
refused-denied=администратор закрыл вам этот канал.
refused-confined=администратор ограничил вас другими каналами.
refused-mandatory=канал администратора обязателен.
refused-too-many=не больше 8 пресетов.
refused-duplicate=этот канал уже в пресетах.
refused-no-presets=нет пресетов для переключения.
refused-no-allowed-preset=сейчас вам не разрешён ни один пресет.
lock-tx=Администратор заблокировал ваш канал передачи.
lock-rx=Администратор заблокировал ваши каналы приёма.
lock-all=Администратор заблокировал ваши каналы и пресеты.

off-caption=Рация выключена
off-tooltip=Полностью выключает рацию: вы ничего не принимаете, включая канал администратора и сообщения сервера, и не передаёте. Блокировки администратора на этот переключатель не действуют.

tx-title=Канал передачи (TX)
tx-muted=Передача запрещена администратором.
tx-not-publisher=На канале администратора говорят только издатели и администраторы; вы можете только слушать.
tx-pick-tooltip=Выберите сигнал: он станет вашим каналом передачи.
tx-current=Передача на:
name-any=ANY
name-here=Здесь

rx-title=Приём (RX)
rx-tx-always=Всегда включён: это ваш канал передачи.
rx-admin=Обязательный канал администратора: вы слышите его, пока рация включена.

presets-title=Пресеты
presets-empty=Пресетов пока нет.
preset-up=Выше
preset-down=Ниже
preset-remove=Убрать
preset-add=Добавить текущий TX
preset-add-tooltip=Добавляет канал передачи в пресеты (не больше 8).
preset-full=Заняты все 8 пресетов.
preset-present=Текущий канал передачи уже в пресетах.
cycle=Следующий пресет
cycle-tooltip=Переключает TX на следующий разрешённый пресет. Горячая клавиша по умолчанию не назначена: назначьте «Переключать пресеты рации» в настройках управления.
cycled=Рация: передача на

known-title=Известные каналы
known-hint=Нажмите на канал, чтобы передавать на нём. Чтобы создать новый канал, выберите неиспользуемый сигнал в выборе TX выше.
known-empty=Пока никто не сидит на канале.
known-tune=Передавать на этом канале
known-admin=админ

honest-short=Каналы разделяют слушателей только среди честных клиентов.
honest-note=Каналы разделяют, кто кого слышит, только среди честных клиентов. Сервер и изменённый клиент могут слышать всё.

