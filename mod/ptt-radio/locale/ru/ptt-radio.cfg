[mod-setting-description]
ptt-radio-companion-port=UDP-порт на этом компьютере, который слушает компаньон ptt-radio.
ptt-radio-echo=Ваш голос возвращается к вам через сервер: так можно в одиночку проверить весь путь звука.
ptt-radio-half-duplex=Как у настоящей рации: пока вы держите клавишу рации, голоса других игроков не звучат. Динамики молчат, поэтому микрофон не может отправить их обратно в эфир эхом. В наушниках эту настройку можно выключить и слышать других, пока говорите сами. На открытый микрофон не действует.
ptt-radio-scope=Все: каждый игрок слышит всех. Только своя команда: каждый слышит только игроков своей команды.

[string-mod-setting]
