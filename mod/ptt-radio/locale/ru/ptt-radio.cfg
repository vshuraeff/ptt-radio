refused-no-allowed-preset=сейчас вам не разрешён ни один пресет.
lock-tx=Администратор заблокировал ваш канал передачи.
lock-rx=Администратор заблокировал ваши каналы приёма.
lock-all=Администратор заблокировал ваши каналы и пресеты.

off-caption=Рация выключена
off-tooltip=Полностью выключает рацию: вы ничего не принимаете, включая канал администратора и сообщения сервера, и не передаёте. Блокировки администратора на этот переключатель не действуют.

tx-title=Канал передачи (TX)
tx-muted=Передача запрещена администратором.
tx-not-publisher=На канале администратора говорят только издатели и администраторы; вы можете только слушать.
tx-pick-tooltip=Выберите сигнал: он станет вашим каналом передачи.
tx-current=Передача на:
name-any=ANY
name-here=Здесь

rx-title=Приём (RX)
