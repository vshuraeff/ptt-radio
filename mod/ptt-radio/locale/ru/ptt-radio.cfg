ptt-radio-admin-title=Администрирование
ptt-radio-admin-rules=Правила рации хранятся в сохранении карты. Блокировка запрещает менять каналы и пресеты, но выключить рацию целиком игрок может всегда. Админ-канал обязателен, только пока рация включена. Каналы решают, что воспроизводят честные клиенты, но не скрывают голос от модифицированного клиента.
ptt-radio-admin-any-warning=Если сделать ANY админ-каналом, его услышат все игроки с включённой рацией, которых допускает настройка «Кто слышит рацию» (по умолчанию — все). Обычных игроков на ANY больше не будет слышно, если они не вещатели и не администраторы.
ptt-radio-admin-signal-help=Выберите сигнал, ANY или HERE — к нему применятся действия с каналом ниже. HERE не может быть обязательным админ-каналом.
ptt-radio-admin-signal=Сигнал
ptt-radio-admin-channel=Назначить админ-канал
ptt-radio-admin-clear-channel=Убрать админ-канал
ptt-radio-admin-ban=Запретить канал
ptt-radio-admin-unban=Снять запрет с канала
ptt-radio-admin-pin=Закрепить канал
ptt-radio-admin-unpin=Открепить канал
ptt-radio-admin-target-help=Игрок: точное имя (здесь без кавычек) или числовой индекс. Запрет канала игроку и снятие личного запрета применяются к выбранному сигналу. tx — передача, rx — приём, both/all — и то и другое.
ptt-radio-admin-mute=Заглушить игрока
ptt-radio-admin-unmute=Снять заглушение
ptt-radio-admin-publisher-add=Разрешить вещание
ptt-radio-admin-publisher-remove=Отозвать право вещания
ptt-radio-admin-deny=Запретить игроку канал
ptt-radio-admin-allow=Снять личный запрет
ptt-radio-admin-lock=Блокировать выбор
ptt-radio-admin-unlock=Разблокировать выбор
ptt-radio-admin-confine-help=Ограничение: перечислите разрешённые каналы через пробел, например ANY item/iron-plate HERE. Обязательный админ-канал по-прежнему слышен, пока рация включена.
ptt-radio-admin-confine=Ограничить каналами
ptt-radio-admin-release=Снять ограничение
ptt-radio-admin-current-channel=Админ-канал: __1__
ptt-radio-admin-current-global=Запрещены: __1__; закреплены: __2__
ptt-radio-admin-current-player=__1__ (#__2__): заглушён=__3__, вещатель=__4__, блокировка=__5__, разрешены=__6__, запреты=__7__
ptt-radio-admin-command-help=Правила рации для администратора. Синтаксис покажет /radio-admin. Каналы: ANY, HERE, тип/имя (имя без типа — это item). Игроки: индекс или точное имя в двойных кавычках.
ptt-radio-admin-usage=Синтаксис: /radio-admin channel <канал>|none; publisher add|remove <игрок>; ban|unban|pin|unpin <канал>; deny <игрок> <канал> tx|rx|both; allow <игрок> <канал>; lock <игрок> tx|rx|all; unlock <игрок>; confine <игрок> <каналы...>; release <игрок>; mute|unmute <игрок>. Имена с пробелами заключайте в двойные кавычки; экранировать кавычки нельзя (используйте индекс).
ptt-radio-admin-applied=Правила рации обновлены.
ptt-radio-admin-unchanged=Это значение уже установлено.
ptt-radio-admin-not-admin=Менять правила рации может только администратор.
ptt-radio-admin-invalid-player=Игрок не найден. Укажите точное имя или положительный числовой индекс.
ptt-radio-admin-invalid-channel=Неверный канал. Укажите ANY, HERE или существующий сигнал тип/имя; параметры и специальные сигналы каналами быть не могут.
ptt-radio-admin-invalid-mode=Неверный режим. Запрет: tx, rx, both. Блокировка: tx, rx, all.
ptt-radio-admin-server=Игрок 0 обозначает сервер; правила рации к нему не применяются.
ptt-radio-admin-mandatory=Админ-канал нельзя запретить ни всем, ни отдельному игроку. Сначала снимите назначение админ-канала или мешающий запрет.
ptt-radio-admin-here-mandatory=HERE привязан к поверхности и не может быть обязательным админ-каналом.
ptt-radio-admin-ban-pin=Канал нельзя одновременно запретить и закрепить. Сначала уберите мешающее правило.
ptt-radio-admin-confine-empty=Нужен хотя бы один разрешённый канал. Чтобы снять ограничение, используйте release.
ptt-radio-admin-confine-banned=Один из разрешённых каналов запрещён для всех. Сначала уберите мешающее правило.
ptt-radio-admin-confine-denied=Один из разрешённых каналов запрещён этому игроку и на передачу, и на приём. Сначала уберите мешающее правило.
ptt-radio-admin-lock-forbidden=Игрок окажется заблокирован на запрещённом канале передачи. Сначала разблокируйте выбор или смените ему канал.

[ptt-radio-settings]
companion-title=Компаньон
companion-why=Моды Factorio не могут ни записывать микрофон, ни воспроизводить голос. Поэтому каждому игроку нужна программа-компаньон: она записывает и воспроизводит звук рации.
companion-trust=Открытый исходный код, лицензия GPL-3.0. К файлам релизов приложены контрольные суммы SHA256SUMS. Исходники и установщик можно проверить в репозитории ниже.
companion-copy=Выделите и скопируйте текст ниже. Запустите установщик в системном терминале, затем запустите установленный компаньон. Для Steam берите точные параметры запуска, которые напечатал установщик; в примерах ниже стандартные пути. Сама Factorio не может ни установить компаньон, ни открыть эти ссылки.
companion-offline=Компаньон: не подключён.
companion-connected-unknown=Компаньон: подключён; версия неизвестна.
companion-connected=Компаньон: __1__; мод: __2__. __3__
companion-older=Компаньон устарел — обновите его.
companion-newer=Компаньон новее этого мода.
companion-matching=Версии совпадают.
companion-notice=Рация: установка компаньона и проверка микрофона — в разделе «Компаньон» окна «Настройки рации».
companion-install-macos=Установка для macOS
companion-install-linux=Установка для Linux
companion-install-windows=Установка для Windows (PowerShell)
companion-install-macos-text=curl -fsSL https://github.com/vshuraeff/ptt-radio/releases/latest/download/install.sh | sh
companion-install-linux-text=curl -fsSL https://github.com/vshuraeff/ptt-radio/releases/latest/download/install.sh | sh
companion-install-windows-text=irm https://github.com/vshuraeff/ptt-radio/releases/latest/download/install.ps1 | iex
companion-steam-macos=Параметры запуска Steam (macOS, стандартная установка)
companion-steam-linux=Параметры запуска Steam (Linux, стандартная установка)
companion-steam-windows=Параметры запуска Steam (Windows; надёжнее скопировать целиком строку «Steam launch options:», которую напечатал установщик, или подставить вместо <папка данных Factorio> папку пользовательских данных Factorio, по умолчанию %APPDATA%\Factorio)
companion-steam-macos-text="$HOME/Library/Application Support/factorio/ptt-radio-companion/ptt-radio-companion" --launch %command%
companion-steam-linux-text="$HOME/.factorio/ptt-radio-companion/ptt-radio-companion" --launch %command%
companion-steam-windows-text="<папка данных Factorio>\ptt-radio-companion\ptt-radio-companion.exe" --launch %command%
companion-repository=Репозиторий исходников
companion-repository-text=https://github.com/vshuraeff/ptt-radio
companion-wiki=Инструкция по установке и работе
companion-wiki-text=https://github.com/vshuraeff/ptt-radio/wiki/RU-Installation
test-button=Проверить микрофон и возврат через игру
test-hint=Сначала на вашем компьютере прозвучит проверочный тон, затем запишутся 3 секунды вашего голоса: запись уйдёт через игру и вернётся к вам. Её услышат и те, кто слушает ваш канал. Правила передачи действуют и здесь. На время проверки, не дольше 15 секунд, включается эхо своего голоса.
test-idle=Проверка ещё не запускалась.
test-pending=Идёт проверка: говорите в микрофон, затем слушайте, что вернётся.
test-running=Проверка уже идёт.
test-unavailable=Перед проверкой подключите компаньон актуальной версии.
test-timeout=Время проверки истекло. Временное эхо своего голоса выключено.
test-disconnected=Проверка отменена: компаньон отключился или перестал поддерживать каналы.
test-result=Проверка: __1__ Тон: __2__. Пик микрофона: __3__ dBFS. Кадров отправлено: __4__; вернулось: __5__. Первый возврат через __6__ мс.
test-outcome-0=завершена.
test-outcome-1=передача запрещена.
test-outcome-2=не удалось открыть микрофон.
test-outcome-3=звуковые кадры не вернулись.
test-outcome-4=компаньон занят передачей.
test-tone-yes=прозвучал
test-tone-no=не прозвучал
test-no-capture=нет записи
