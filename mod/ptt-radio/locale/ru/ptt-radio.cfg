[mod-setting-name]
ptt-radio-companion-port=Порт компаньона
ptt-radio-echo=Эхо своего голоса
ptt-radio-half-duplex=Глушить эфир, пока говорю
ptt-radio-scope=Кто слышит рацию

[mod-setting-description]
ptt-radio-companion-port=UDP-порт на этом компьютере, который слушает компаньон ptt-radio.
ptt-radio-echo=Возвращать ваш голос вам через сервер. Для проверки всего тракта в одиночку.
ptt-radio-half-duplex=Пока вы держите клавишу рации, голоса других не звучат, как у настоящей рации: динамики молчат, и микрофон не возвращает их в эфир эхом. Если вы в наушниках, можно выключить и слышать собеседников во время своей речи. На открытый микрофон не действует.
ptt-radio-scope=Все: каждый слышит всех. Своя команда: игроки слышат только свою силу (force).

[string-mod-setting]
ptt-radio-scope-all=Все
ptt-radio-scope-force=Только своя команда

[controls]
ptt-radio-toggle-mic=Открытый микрофон вкл/выкл
ptt-radio-settings-open=Открыть настройки рации
ptt-radio-settings-cycle=Переключать пресеты рации
