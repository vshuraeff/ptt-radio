ptt-radio-admin-title=Administration
ptt-radio-admin-rules=Policies persist in the save. Locks cover channel and preset selection; players can always turn the whole radio off. The admin channel is mandatory only while on. Channels control honest clients' playback, not confidentiality against modified clients.
ptt-radio-admin-any-warning=ANY as the admin channel reaches every radio-on listener the radio scope setting allows (everyone by default). Ordinary ANY senders become silent unless they are publishers or admins.
ptt-radio-admin-signal-help=Choose a signal, ANY or HERE for the channel actions below. HERE cannot be the mandatory admin channel.
ptt-radio-admin-signal=Signal
ptt-radio-admin-channel=Set admin channel
ptt-radio-admin-clear-channel=Clear admin channel
ptt-radio-admin-ban=Ban channel
ptt-radio-admin-unban=Unban channel
ptt-radio-admin-pin=Pin channel
ptt-radio-admin-unpin=Unpin channel
ptt-radio-admin-target-help=Player: exact name (without quotes here) or numeric index. The selected signal is used for deny/allow. tx = speaking, rx = listening, both/all = both.
ptt-radio-admin-mute=Mute player
ptt-radio-admin-unmute=Unmute player
ptt-radio-admin-publisher-add=Allow broadcast
ptt-radio-admin-publisher-remove=Revoke broadcast
ptt-radio-admin-deny=Deny channel
ptt-radio-admin-allow=Clear channel denial
ptt-radio-admin-lock=Lock selections
ptt-radio-admin-unlock=Unlock selections
ptt-radio-admin-confine-help=Confinement: enter allowed channel keys separated by spaces, e.g. ANY item/iron-plate HERE. Mandatory admin reception remains available while the radio is on.
ptt-radio-admin-confine=Apply confinement
ptt-radio-admin-release=Lift confinement
ptt-radio-admin-current-channel=Admin channel: __1__
ptt-radio-admin-current-global=Banned: __1__; pinned: __2__
ptt-radio-admin-current-player=__1__ (#__2__): muted=__3__, publisher=__4__, lock=__5__, allowed=__6__, denied=__7__
ptt-radio-admin-command-help=Admin radio policy. Run /radio-admin for syntax. Signals: ANY, HERE, type/name (bare names mean item). Players: index or exact name in double quotes.
ptt-radio-admin-usage=Usage: /radio-admin channel <signal>|none; publisher add|remove <player>; ban|unban|pin|unpin <signal>; deny <player> <signal> tx|rx|both; allow <player> <signal>; lock <player> tx|rx|all; unlock <player>; confine <player> <signal...>; release <player>; mute|unmute <player>. Use double quotes around names with spaces; no quote escapes (use an index instead).
ptt-radio-admin-applied=Radio policy updated.
ptt-radio-admin-unchanged=Radio policy already has that value.
ptt-radio-admin-not-admin=Only an administrator can change radio policy.
ptt-radio-admin-invalid-player=Player not found. Use an exact player name or a positive numeric index.
ptt-radio-admin-invalid-channel=Invalid channel. Use ANY, HERE or an existing signal type/name; parameter and special signals are not channels.
ptt-radio-admin-invalid-mode=Invalid mode. Deny: tx, rx or both. Lock: tx, rx or all.
ptt-radio-admin-server=Player 0 is the server source, not a policy target.
ptt-radio-admin-mandatory=The admin channel cannot be banned or denied. Clear its designation or remove the conflicting ban/denial first.
ptt-radio-admin-here-mandatory=HERE is surface-relative and cannot be the mandatory admin channel.
ptt-radio-admin-ban-pin=A channel cannot be both banned and pinned. Remove the conflicting rule first.
ptt-radio-admin-confine-empty=Confinement needs at least one allowed channel. Use release to lift it.
ptt-radio-admin-confine-banned=An allowed confinement channel is banned. Remove the conflicting rule first.
ptt-radio-admin-confine-denied=An allowed confinement channel is denied in both directions. Remove the conflicting rule first.
ptt-radio-admin-lock-forbidden=The player would be locked on a forbidden TX channel. Unlock or change their channel before applying this rule.

