ptt-radio-companion-port=Companion port
ptt-radio-echo=Echo my own voice
ptt-radio-half-duplex=Mute the radio while I talk
ptt-radio-scope=Who hears the radio

[mod-setting-description]
ptt-radio-companion-port=UDP port on this computer where the ptt-radio companion listens.
ptt-radio-echo=Send your own voice back to you through the server. For testing the full voice path alone.
ptt-radio-half-duplex=While you hold the radio key, other players' voices are silent, like a real radio: your speakers stay quiet, so your microphone cannot send them back as echo. With headphones you can turn this off and hear others while you talk. Has no effect on the open microphone.
ptt-radio-scope=all: every player hears everyone. force: players hear only their own force.

[string-mod-setting]
ptt-radio-scope-all=Everyone
ptt-radio-scope-force=Own force only

[controls]
ptt-radio-toggle-mic=Toggle open microphone
